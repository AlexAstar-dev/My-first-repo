name: Check README and Build

on: [push]

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Check if README exists
        run: |
          if [ -f README.md ]; then
            echo "README found ✅"
          else
            echo "README missing ❌"
            exit 1
          fi

      - name: Simulate build
        run: |
          echo "Building app..."
          echo "Build successful 🎉"
